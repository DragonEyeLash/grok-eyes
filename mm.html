<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E31C23">
<meta name="apple-mobile-web-app-title" content="M&amp;M Eyes">
<link rel="manifest" href="mm.webmanifest">
<title>M&amp;M Eyes</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;background:#E31C23}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const q = new URLSearchParams(location.search);
const COLORS = { red:'#E31C23', yellow:'#FFD100', green:'#00A651', blue:'#0057A6', orange:'#F7941D', brown:'#6B3A2A', pink:'#F4A6C7' };
let bgKey = (q.get('bg') || q.get('color') || 'red').toLowerCase();
let bg = COLORS[bgKey] || (/^[0-9a-f]{6}$/i.test(bgKey) ? '#'+bgKey : bgKey);
const look = (q.get('look') || q.get('style') || 'female').toLowerCase();
const isFemale = look !== 'male' && look !== 'plain';
document.body.style.background = bg;
document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
document.title = 'M&M Eyes — ' + bgKey + (isFemale ? ' (her)' : ' (him)');

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W=0,H=0,dpr=Math.min(devicePixelRatio||1,3);
function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

function lighten(hex,amt){const m=/^#?([0-9a-f]{6})$/i.exec(hex);if(!m)return hex;const n=parseInt(m[1],16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.min(255,Math.round(r+(255-r)*amt));g=Math.min(255,Math.round(g+(255-g)*amt));b=Math.min(255,Math.round(b+(255-b)*amt));return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}

let lookX=0,lookY=0,targetX=0,targetY=0,nextLook=0;
let blinkAt=0,nextBlink=performance.now()+1600;
// wink: which eye (-1 left, +1 right, 0 none), progress
let winkSide=0,winkAt=0,nextWink=performance.now()+5000;

function eyeOpen(side,t){
  // normal blink both eyes
  let open=1;
  const b=(t-blinkAt)/140;
  if(b>=0&&b<2) open=Math.max(0.04,Math.abs(1-b));
  // wink one eye
  if(winkSide===side){
    const w=(t-winkAt)/220;
    if(w>=0&&w<2.4){
      const wo=w<1?1-w:Math.min(1,(w-1)/1.4);
      open=Math.min(open,Math.max(0.02,wo));
    }
  }
  return open;
}

function drawCandyLid(cx,cy,rx,ry,open,lidDrop){
  if(open<0.06) return;
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(cx,cy,rx,ry*open,0,0,Math.PI*2);
  ctx.clip();
  ctx.fillStyle=lighten(bg,0.06);
  // lid edge sits lower as lidDrop rises (0.35 pink, 0.5 blue)
  const edgeY=cy-ry*open*(1-lidDrop*1.15);
  ctx.beginPath();
  ctx.moveTo(cx-rx*1.02,cy-ry*open-2);
  ctx.lineTo(cx+rx*1.02,cy-ry*open-2);
  ctx.lineTo(cx+rx*1.02,edgeY);
  // soft curved lid edge (bedroom / cool)
  ctx.quadraticCurveTo(cx,edgeY+ry*open*0.55,cx-rx*1.02,edgeY);
  ctx.closePath();
  ctx.fill();
  // lid rim line
  ctx.beginPath();
  ctx.moveTo(cx-rx*0.96,edgeY+ry*open*0.02);
  ctx.quadraticCurveTo(cx,edgeY+ry*open*0.5,cx+rx*0.96,edgeY+ry*open*0.02);
  ctx.strokeStyle='rgba(0,0,0,0.32)';
  ctx.lineWidth=Math.max(1.8,rx*0.038);
  ctx.stroke();
  ctx.restore();
  return edgeY;
}

/** Pink M&M: thick continuous upper lid + 4 outer upward curls (no brows) */
function drawPinkLashes(cx,cy,rx,ry,open,side,edgeY){
  if(open<0.12) return;
  ctx.save();
  ctx.strokeStyle='#0a0a0a';
  ctx.fillStyle='#0a0a0a';
  ctx.lineCap='round';
  ctx.lineJoin='round';

  // Thick continuous mascara line across the upper lid (follows lid curve)
  const y0 = edgeY + ry*open*0.04;
  ctx.lineWidth = Math.max(4.5, rx*0.11);
  ctx.beginPath();
  const innerX = cx - side*rx*0.96;
  const outerX = cx + side*rx*0.90;
  ctx.moveTo(innerX, y0 + ry*open*0.04);
  ctx.quadraticCurveTo(cx, edgeY + ry*open*0.48, outerX, y0 + ry*open*0.02);
  ctx.stroke();

  // Four distinct outer lashes curling up/out like Pink reference
  // Roots sit along outer half of lid; tip curves outward and up
  const lashes = [
    { along: 0.55, out: 0.18, lift: 0.28, bend: 0.55, w: 0.055 },
    { along: 0.72, out: 0.28, lift: 0.40, bend: 0.58, w: 0.065 },
    { along: 0.86, out: 0.36, lift: 0.52, bend: 0.62, w: 0.075 },
    { along: 0.98, out: 0.42, lift: 0.58, bend: 0.65, w: 0.080 }
  ];
  for (const L of lashes) {
    // root position along lid from center toward outer corner
    const tAlong = L.along;
    const rxRoot = cx + side * rx * (tAlong * 0.9);
    // sample lid curve roughly
    const ryRoot = y0 + ry*open*(0.02 + (1-tAlong)*0.08);
    const sx = rxRoot;
    const sy = ryRoot;
    const ex = sx + side * rx * L.out;
    const ey = sy - ry * L.lift;
    // control point pulls tip into a soft upward curl
    const cpx = sx + side * rx * (L.out * L.bend);
    const cpy = sy - ry * (L.lift * 0.35);
    ctx.lineWidth = Math.max(2.8, rx * L.w);
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo(cpx, cpy, ex, ey);
    ctx.stroke();
  }
  ctx.restore();
}

function drawEyeFemale(cx,cy,rx,ry,open,side){
  // no brows (Pink reference lashes only)

  // sclera — slightly wider oval like Pink
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(cx,cy,rx,ry*open,0,0,Math.PI*2);
  ctx.fillStyle='#fff';
  ctx.fill();
  ctx.lineWidth=Math.max(1.8,rx*0.035);
  ctx.strokeStyle='#111';
  ctx.stroke();
  ctx.clip();

  // pupil — soft friendly gaze, a bit toward center and slightly down
  const px=cx+(lookX*0.5+side*-0.08)*rx*0.42;
  const py=cy+(lookY*0.4+0.12)*ry*0.42;
  const pr=rx*0.48;
  ctx.beginPath();ctx.arc(px,py,pr,0,Math.PI*2);ctx.fillStyle='#111';ctx.fill();
  // Strong gleaming highlights (friendly Pink look)
  ctx.beginPath();ctx.arc(px-pr*0.30,py-pr*0.36,pr*0.26,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  ctx.beginPath();ctx.arc(px+pr*0.28,py+pr*0.18,pr*0.12,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fill();
  ctx.beginPath();ctx.arc(px-pr*0.05,py-pr*0.05,pr*0.06,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.45)';ctx.fill();
  ctx.restore();

  // bedroom lid ~top third (Pink)
  const edgeY=drawCandyLid(cx,cy,rx,ry,open,0.36);
  if(open>0.1&&edgeY!=null){
    drawPinkLashes(cx,cy,rx,ry,open,side,edgeY);
  }
}

function drawEyeMale(cx,cy,rx,ry,open,side){
  // Blue M&M: thicker, more angular cool brows
  ctx.save();
  ctx.strokeStyle='#111';
  ctx.lineCap='round';
  ctx.lineWidth=Math.max(3.8,rx*0.13);
  const by=cy-ry*1.32;
  // inner lower, peak, outer slightly down — skeptical/cool
  ctx.beginPath();
  ctx.moveTo(cx-side*rx*0.92,by+ry*0.16);
  ctx.quadraticCurveTo(cx-side*rx*0.15,by-ry*0.18,cx+side*rx*0.55,by-ry*0.12);
  ctx.quadraticCurveTo(cx+side*rx*0.9,by-ry*0.02,cx+side*rx*1.05,by+ry*0.12);
  ctx.stroke();
  ctx.restore();

  // sclera — rounder tall oval, closer-set handled by gap
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(cx,cy,rx,ry*open,0,0,Math.PI*2);
  ctx.fillStyle='#fff';
  ctx.fill();
  ctx.lineWidth=Math.max(1.8,rx*0.035);
  ctx.strokeStyle='#111';
  ctx.stroke();
  ctx.clip();

  // dark brown pupil sitting LOW under the heavy lid
  const px=cx+lookX*rx*0.28;
  const py=cy+(0.32+lookY*0.25)*ry*open*0.9;
  const pr=rx*0.33;
  ctx.beginPath();ctx.arc(px,py,pr,0,Math.PI*2);ctx.fillStyle='#2a1810';ctx.fill();
  ctx.beginPath();ctx.arc(px-pr*0.22,py-pr*0.28,pr*0.14,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.7)';ctx.fill();
  ctx.restore();

  // Blue: heavy lid ~half the eye, no lashes
  drawCandyLid(cx,cy,rx,ry,open,0.52);
}

function frame(t){
  if(t>nextLook){
    if(isFemale){
      // softer friendly glances
      targetX=(Math.random()*1.2-0.6);
      targetY=Math.random()*0.5-0.05;
      if(Math.random()<0.4){targetX=0;targetY=0.1}
    }else{
      targetX=Math.random()*1.0-0.5;
      targetY=Math.random()*0.4+0.05;
      if(Math.random()<0.4){targetX=0;targetY=0.2}
    }
    nextLook=t+900+Math.random()*2200;
  }
  lookX+=(targetX-lookX)*0.1;
  lookY+=(targetY-lookY)*0.1;

  if(t>nextBlink){blinkAt=t;nextBlink=t+2200+Math.random()*3200}
  if(isFemale&&t>nextWink){
    winkSide=Math.random()<0.5?-1:1;
    winkAt=t;
    nextWink=t+6000+Math.random()*8000;
  }

  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(isFemale){
    // taller ovals like Pink reference; slightly narrower face-width
    const rx=Math.min(W*0.175,H*0.28);
    const ry=rx*1.28;
    const gap=rx*1.32;
    const cy=H*0.52;
    const oL=eyeOpen(-1,t),oR=eyeOpen(1,t);
    drawEyeFemale(W/2-gap,cy,rx,ry,oL,-1);
    drawEyeFemale(W/2+gap,cy,rx,ry,oR,1);
  }else{
    // Blue: closer together, slightly taller ovals
    const rx=Math.min(W*0.18,H*0.32);
    const ry=rx*1.2;
    const gap=rx*1.08;
    const cy=H*0.52;
    const o=eyeOpen(0,t); // both same (no wink for male)
    // force shared blink only
    let open=1;const b=(t-blinkAt)/140;if(b>=0&&b<2)open=Math.max(0.04,Math.abs(1-b));
    drawEyeMale(W/2-gap,cy,rx,ry,open,-1);
    drawEyeMale(W/2+gap,cy,rx,ry,open,1);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function goFullscreen(){const el=document.documentElement;const req=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;if(req)req.call(el)}
document.addEventListener('click',goFullscreen);
document.addEventListener('touchend',goFullscreen,{passive:true});
</script>
</body>
</html>
